############################
# CORE
############################
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on       # Crucial for Neovim/Vim autoread and git plugins
set -g set-clipboard on      # Sync tmux clipboard with OS clipboard

set -g @floax-bind '-n M-f'

############################
# PREFIX
############################
unbind C-b
set -g prefix C-s
bind C-s send-prefix

############################
# RELOAD
############################
bind R source-file ~/.tmux.conf \; display "Tmux reloaded!"

############################
# INDEX & CWD (Current Working Dir)
############################
set -g base-index 1
setw -g pane-base-index 1

############################
# SPLITS (Context-Aware)
############################
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

############################
# TOKYODARK COLORS (Lualine Matched)
############################
set -g @bg "#11121D"
set -g @dim_bg "#0a0b14"
set -g @fg "#A0A8E3"
set -g @gray "#212234"
set -g @gray_light "#4A5057"
set -g @green "#9ECE6A"  # Matched to vibrant Lualine lime-green
set -g @blue "#7199EE"
set -g @purple "#A485DD"
set -g @yellow "#D7A65F"
set -g @orange "#F69C5E"

############################
# STATUS BAR (LUALINE TRANSPARENT CLONE)
############################
set -g status 2  # Enables a second status line to act as a margin gap
set -g status-format[1] "#[bg=#{@bg}]"  # Leaves the second line empty/transparent

set -g status-position top
set -g status-interval 1

set -g status-style "bg=#{@bg} fg=#{@fg}"
set -g status-left-length 100
set -g status-right-length 100

# Left Side: Colored Mode Bubble + Transparent Session Text
set -g status-left "#{?#{==:#{client_key_table},root},#[fg=#{@green}]#[bg=#{@bg}]#[bg=#{@green}]#[fg=#{@bg}]#[bold]  NORMAL#[fg=#{@green}]#[bg=#{@bg}],}#{?#{==:#{client_key_table},pane-mode},#[fg=#{@blue}]#[bg=#{@bg}]#[bg=#{@blue}]#[fg=#{@bg}]#[bold]  PANE#[fg=#{@blue}]#[bg=#{@bg}],}#{?#{==:#{client_key_table},tab-mode},#[fg=#{@purple}]#[bg=#{@bg}]#[bg=#{@purple}]#[fg=#{@bg}]#[bold]  TAB#[fg=#{@purple}]#[bg=#{@bg}],}#{?#{==:#{client_key_table},resize-mode},#[fg=#{@yellow}]#[bg=#{@bg}]#[bg=#{@yellow}]#[fg=#{@bg}]#[bold]  RESIZE#[fg=#{@yellow}]#[bg=#{@bg}],}#{?#{==:#{client_key_table},move-mode},#[fg=#{@orange}]#[bg=#{@bg}]#[bg=#{@orange}]#[fg=#{@bg}]#[bold]  MOVE#[fg=#{@orange}]#[bg=#{@bg}],} #[fg=#{@fg}]#[bg=#{@bg}]#[bold] #S "

# Right Side: Transparent Info Text + Green Time Bubble touching the right edge
set -g status-right "#[fg=#{@fg}]#[bg=#{@bg}] #(whoami) #[fg=#{@gray_light}]| #[fg=#{@fg}] %d %b #[fg=#{@green}]#[bg=#{@bg}]#[bg=#{@green}]#[fg=#{@bg}]#[bold] %I:%M %p#[fg=#{@green}]#[bg=#{@bg}]"

############################
# WINDOWS (MINIMAL TABS)
############################
set -g window-status-separator "  " # Double space for breathing room

# Inactive Window: Transparent background, muted gray text
set -g window-status-format "#[fg=#{@gray_light},bg=#{@bg}]#I  #W"

# Active Window: Subtle deep gray bubble with bright blue text
set -g window-status-current-format "#[fg=#{@gray},bg=#{@bg}]#[fg=#{@blue},bg=#{@gray},bold]#I  #W#[fg=#{@gray},bg=#{@bg}]"

set -g pane-border-style "fg=#{@gray_light}"
set -g pane-active-border-style "fg=#{@blue}"

# Dim inactive panes (Remove these two lines if you use terminal transparency)
set -g window-style "bg=#{@dim_bg}"
set -g window-active-style "bg=#{@bg}"

############################
# MESSAGES
############################
set -g message-style "bg=#{@bg} fg=#{@yellow}"
set -g message-command-style "bg=#{@bg} fg=#{@purple}"

############################
# COPY MODE (Vim Style)
############################
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
setw -g mode-style "bg=#{@blue} fg=#{@bg}"

############################
# EXTRA POLISH
############################
set -g renumber-windows on
set -g status-justify centre
set -g display-panes-active-colour "#9ECE6A" # Tokyo Dark Green
set -g display-panes-colour "#F69C5E"        # Tokyo Dark Orange

################################################################
# ZELLIJ-LIKE MODES
################################################################

##### PANE MODE (Ctrl+s p) #####
bind p switch-client -T pane-mode

bind -T pane-mode h select-pane -L
bind -T pane-mode j select-pane -D
bind -T pane-mode k select-pane -U
bind -T pane-mode l select-pane -R

bind -T pane-mode c command-prompt -p "Rename pane:" "select-pane -T '%%'"
bind -T pane-mode d split-window -v -c "#{pane_current_path}"
bind -T pane-mode r split-window -h -c "#{pane_current_path}"
bind -T pane-mode n split-window -c "#{pane_current_path}"
bind -T pane-mode x kill-pane
bind -T pane-mode f resize-pane -Z
bind -T pane-mode z display-panes
bind -T pane-mode w break-pane
bind -T pane-mode Tab select-pane -t :.+
bind -T pane-mode Escape switch-client -T root

##### TAB MODE (Ctrl+s t) #####
bind t switch-client -T tab-mode

bind -T tab-mode h previous-window \; switch-client -T tab-mode
bind -T tab-mode l next-window \; switch-client -T tab-mode
bind -T tab-mode j next-window \; switch-client -T tab-mode
bind -T tab-mode k previous-window \; switch-client -T tab-mode

bind -T tab-mode n new-window -c "#{pane_current_path}"
bind -T tab-mode x kill-window
bind -T tab-mode r command-prompt -p "Rename tab:" "rename-window '%%'"
bind -T tab-mode b break-pane
bind -T tab-mode s setw synchronize-panes
bind -T tab-mode Tab last-window
bind -T tab-mode Escape switch-client -T root
bind -T tab-mode Enter switch-client -T root

##### RESIZE MODE (Ctrl+s r) #####
bind r switch-client -T resize-mode

bind -T resize-mode h resize-pane -L 5 \; switch-client -T resize-mode
bind -T resize-mode j resize-pane -D 5 \; switch-client -T resize-mode
bind -T resize-mode k resize-pane -U 5 \; switch-client -T resize-mode
bind -T resize-mode l resize-pane -R 5 \; switch-client -T resize-mode

bind -T resize-mode H resize-pane -L 10 \; switch-client -T resize-mode
bind -T resize-mode J resize-pane -D 10 \; switch-client -T resize-mode
bind -T resize-mode K resize-pane -U 10 \; switch-client -T resize-mode
bind -T resize-mode L resize-pane -R 10 \; switch-client -T resize-mode

bind -T resize-mode + resize-pane -U 5 \; switch-client -T resize-mode
bind -T resize-mode - resize-pane -D 5 \; switch-client -T resize-mode
bind -T resize-mode = resize-pane -U 5 \; switch-client -T resize-mode
bind -T resize-mode Escape switch-client -T root
bind -T resize-mode Enter switch-client -T root

##### MOVE MODE (Ctrl+s m) #####
bind m switch-client -T move-mode

bind -T move-mode h swap-pane -U \; switch-client -T move-mode
bind -T move-mode j swap-pane -D \; switch-client -T move-mode
bind -T move-mode k swap-pane -U \; switch-client -T move-mode
bind -T move-mode l swap-pane -D \; switch-client -T move-mode

bind -T move-mode n swap-pane -t :.+ \; switch-client -T move-mode
bind -T move-mode p swap-pane -t :.- \; switch-client -T move-mode
bind -T move-mode Tab swap-pane -t :.+ \; switch-client -T move-mode
bind -T move-mode Escape switch-client -T root
bind -T move-mode Enter switch-client -T root

##### SCROLL MODE (Ctrl+s s) #####
bind s copy-mode

##### SESSION MODE (Ctrl+s o) #####
bind o choose-tree -Zs

################################################################
# GLOBAL ALT BINDINGS (Fast Navigation)
################################################################
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-+ resize-pane -U 5
bind -n M-- resize-pane -D 5
bind -n M-= resize-pane -U 5

bind -n M-[ previous-layout
bind -n M-] next-layout

################################################################
# QUICK TAB NUMBERS
################################################################
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

############################
# PLUGINS
############################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-floax'

# Plugin Configs
set -g @continuum-restore 'off'                 
set -g @continuum-save-interval '15'
TMUX_FZF_LAUNCH_KEY="C-f"

############################
# TPM (Must remain at bottom)
############################
run '~/.tmux/plugins/tpm/tpm'
