source = ~/.cache/iris/colors-hyprlock.conf

$font = JetBrains Mono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOut, 0.33, 1, 0.68, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 4
    
    # Dimmed slightly to give the lockscreen a true "dark glass" feel
    contrast = 0.95
    brightness = 0.65
    vibrancy = 0.15
}

# ------------------------------
# INPUT FIELD STYLING
# ------------------------------
input-field {
    monitor =
    size = 22%, 6%
    outline_thickness = 2
    rounding = 16

    # Obsidian dark surface translucent pocket (75% opacity -> bf)
    inner_color = rgba(${surface_hex}bf)

    # Muted border transitioning to Vibrant Accent on typing, Vibrant Red on fail
    outer_color = rgba(${dim_hex}ff)
    check_color = rgba(${accent_hex}ff)
    fail_color = rgba(${red_hex}ff)

    # Crisp foreground typed text
    font_color = rgba(${fg_hex}ff)
    fade_on_empty = false

    dots_spacing = 0.35

    # Pango markup dynamically colored with Iris hex variables
    placeholder_text = <span foreground="##$dim_hex">  Enter Password...</span>
    fail_text = <span foreground="##$bg_hex"> Authentication Failed</span>

    font_family = $font

    position = 0, -120
    halign = center
    valign = center
}

# ------------------------------
# TIME
# ------------------------------
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    font_size = 140
    font_family = $font
    
    # Crisp Iris Foreground
    color = rgba(${fg_hex}ff)

    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(0, 0, 0, 0.45)

    position = 0, 130
    halign = center
    valign = center
}

# ------------------------------
# DATE
# ------------------------------
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 34
    font_family = $font
    
    # Vibrant Iris Accent highlight for the date
    color = rgba(${accent_hex}ff)

    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.45)

    # position = 0, 30
    halign = center
    valign = center
}

