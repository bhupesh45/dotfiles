# ================= VIDEO =================

profile=gpu-hq
vo=gpu-next
#gpu-api=vulkan
#gpu-context=wayland
hwdec=vaapi

# Luma scaling (sharp anime/text)
scale=ewa_lanczossharp
scale-antiring=0.8
sigmoid-upscaling=yes

# Chroma scaling
cscale=spline36
cscale-antiring=0.8

# Downscaling
dscale=mitchell

# Dithering
dither=error-diffusion
temporal-dither=yes

# Debanding
deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=8

# ================= HDR / Tone Mapping =================

tone-mapping=bt.2390              # Better highlight rolloff (Windows-like)
hdr-compute-peak=yes
target-peak=200                   # Key for brightness (100=flat, 200=HDR feel)

# Color tuning (IMPORTANT)
contrast=1.08
saturation=1.18
gamma=1.04

icc-profile-auto=yes
gamut-mapping-mode=perceptual     # Better than clip (prevents oversaturation)
target-trc=bt.1886
fbo-format=rgba16f

# ================= GENERAL =================

autofit=70%
keep-open=yes
cursor-autohide=1000
save-position-on-quit
osd-bar=no
osd-font-size=28
volume=100
volume-max=150
audio-exclusive=no

# ================= SUBTITLES =================

alang=jp,jpn,ja,en,eng
slang=en,eng,jp,jpn,ja
sub-auto=fuzzy
sub-font="Source Sans Pro"
sub-font-size=36
sub-border-size=1.5
sub-shadow-color=0.0/0.0/0.0/0.50
sub-shadow-offset=2

# ================= SCREENSHOTS =================

screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-directory="~/Videos/mpv-shots"
screenshot-template="%f-%wH.%wM.%wS.%wT-#%#00n"

# ================= SYNC =================

video-sync=display-resample
interpolation=yes
tscale=oversample

# ================= AUDIO =================

ao=pulse
audio-buffer=0.2
