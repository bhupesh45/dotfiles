# ==============================================================================
# LINUX SYSTEM SPECIFICS (Wayland & PipeWire)
# ==============================================================================
vo=gpu-next                 # Modern video renderer, better color and HDR handling
gpu-context=wayland         # Force Wayland (falls back to X11 if unavailable)
hwdec=auto-safe             # Hardware decoding (safe mode to avoid color space bugs)

ao=pipewire,pulse           # Use PipeWire for audio, fallback to PulseAudio
audio-channels=auto-safe    # Output exactly what your hardware supports

# ==============================================================================
# GENERAL & QUALITY OF LIFE
# ==============================================================================
profile=gpu-hq              # High-quality default settings
keep-open=yes               # Keep the player open when a file ends
save-position-on-quit=yes   # Remember where you left off
autofit=70%                 # Open at 70% of your screen size (don't fill screen on launch)
cursor-autohide=1000        # Hide cursor after 1 second of no movement
osd-bar=no                  # Hide the default bulky OSD bar

# ==============================================================================
# ANIME SCALING (Sharp line art, no ringing)
# ==============================================================================
# Up-scaling (when watching 1080p on a 1440p/4K screen)
scale=ewa_lanczossharp
scale-antiring=0.8          # Prevents white halo outlines around black anime line art

# Down-scaling (when watching 4K on a 1080p screen)
dscale=mitchell
dscale-antiring=0.7

# Chroma scaling (color data)
cscale=spline36
cscale-antiring=0.7

# ==============================================================================
# DEBANDING (Crucial for Anime)
# ==============================================================================
# Anime heavily suffers from color banding (step-like gradients in skies/shadows).
deband=yes                  # Enable debanding by default
deband-iterations=4         # Higher = better quality, more GPU usage
deband-threshold=35         # How aggressively to deband (35 is a good sweet spot)
deband-range=16             # Radius of the deband filter
deband-grain=5              # Inject a tiny amount of noise to mask banding further

# Dithering (smooths out colors on 8-bit/10-bit monitors)
dither=error-diffusion
dither-depth=auto

# ==============================================================================
# MOTION & SYNC (Smooth 24fps on 60Hz/120Hz/144Hz monitors)
# ==============================================================================
video-sync=display-resample # Sync video fps to your monitor's refresh rate
interpolation=yes           # Enable motion interpolation (reduces anime panning stutter)
tscale=oversample           # The algorithm used for interpolation (smooth, low artifacts)

# ==============================================================================
# LANGUAGES & SUBTITLES (Fansub Optimized)
# ==============================================================================
# Default to Japanese audio and English subtitles
alang=jpn,jp,ja,eng,en
slang=eng,en,enUS

# Subtitle visual settings (Fallback for text-based subs like SRT)
sub-auto=fuzzy              # Load all subtitle files containing the video's name
sub-font="Source Sans Pro"
sub-font-size=40
sub-border-size=2
sub-shadow-color=0.0/0.0/0.0/0.50
sub-shadow-offset=2
sub-margin-y=40

# Fix for Complex ASS Subtitles (Anime Fansubs)
# This prevents upscaling algorithms from blurring high-quality stylized subtitles
blend-subtitles=no
