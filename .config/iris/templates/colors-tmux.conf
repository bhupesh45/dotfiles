# ===================================================================
# AUTO-GENERATED BY IRIS (ROUNDED PILLS + MINIMAL TEXT EDITION)
# ===================================================================

set -g @bg "{bg}"
set -g @fg "{fg}"
set -g @gray "{surface}"
set -g @gray_light "{dim}"
set -g @green "{green}"
set -g @blue "{accent}"
set -g @purple "{syntax_keyword}"
set -g @yellow "{yellow}"
set -g @orange "{syntax_const}"
set -g @red "{red}"

# Keep background transparent to match Kitty & Neovim
set -g window-style "bg=default"
set -g window-active-style "bg=default"
set -g status-style "bg=default,fg=#{@fg}"
set -g status-format[1] "#[bg=default]"

# -------------------------------------------------------------------
# LEFT: Rounded Mode Pill +  Session Pill + Zoom Pill
# -------------------------------------------------------------------
set -g status-left "#{?client_prefix,#[fg=#{@red}]#[bg=default]#[bg=#{@red}]#[fg=#{@bg}]#[bold]WAIT#[fg=#{@red}]#[bg=#{@gray}],#{?#{==:#{client_key_table},root},#[fg=#{@green}]#[bg=default]#[bg=#{@green}]#[fg=#{@bg}]#[bold]NORM#[fg=#{@green}]#[bg=#{@gray}],}#{?#{==:#{client_key_table},pane-mode},#[fg=#{@blue}]#[bg=default]#[bg=#{@blue}]#[fg=#{@bg}]#[bold]PANE#[fg=#{@blue}]#[bg=#{@gray}],}#{?#{==:#{client_key_table},tab-mode},#[fg=#{@purple}]#[bg=default]#[bg=#{@purple}]#[fg=#{@bg}]#[bold]TAB#[fg=#{@purple}]#[bg=#{@gray}],}#{?#{==:#{client_key_table},resize-mode},#[fg=#{@yellow}]#[bg=default]#[bg=#{@yellow}]#[fg=#{@bg}]#[bold]SIZE#[fg=#{@yellow}]#[bg=#{@gray}],}#{?#{==:#{client_key_table},move-mode},#[fg=#{@orange}]#[bg=default]#[bg=#{@orange}]#[fg=#{@bg}]#[bold]MOVE#[fg=#{@orange}]#[bg=#{@gray}],}}#[bg=#{@gray},fg=#{@fg},bold]  #S#[fg=#{@gray},bg=default]#{?window_zoomed_flag, #[fg=#{@yellow}]#[bg=default]#[bg=#{@yellow}]#[fg=#{@bg}]#[bold]ZOOM#[fg=#{@yellow}]#[bg=default],}"

# -------------------------------------------------------------------
# CENTER: Rounded Two-Tone Window Tabs (No * or - flags, no extra icons)
# -------------------------------------------------------------------
set -g window-status-separator "  "

# Inactive Tab: Rounded dark pill
set -g window-status-format "#[fg=#{@gray},bg=default]#[fg=#{@gray_light},bg=#{@gray}]#I : #W#[fg=#{@gray},bg=default]"

# Active Tab: Rounded Blue index cap + dark surface title pill (no *)
set -g window-status-current-format "#[fg=#{@blue},bg=default]#[fg=#{@bg},bg=#{@blue},bold]#I#[fg=#{@blue},bg=#{@gray}]#[fg=#{@fg},bg=#{@gray},bold] #W#[fg=#{@gray},bg=default]"

set -g window-status-bell-style "fg=#{@bg},bg=#{@red},bold"

# -------------------------------------------------------------------
# RIGHT: Rounded Directory Pill + Connected Date & Green Clock Pill
# -------------------------------------------------------------------
set -g status-right "#[fg=#{@purple},bg=default]#[fg=#{@bg},bg=#{@purple},bold]DIR#[fg=#{@purple},bg=#{@gray}]#[fg=#{@fg},bg=#{@gray},bold] #{b:pane_current_path}#[fg=#{@gray},bg=default] #[fg=#{@gray},bg=default]#[fg=#{@gray_light},bg=#{@gray}]%d %b #[fg=#{@green},bg=#{@gray}]#[fg=#{@bg},bg=#{@green},bold]%I:%M %p#[fg=#{@green},bg=default]"

# -------------------------------------------------------------------
# BORDERS, MESSAGES & FLOAX
# -------------------------------------------------------------------
set -g pane-border-style "fg=#{@gray}"
set -g pane-active-border-style "fg=#{@blue}"
set -g message-style "bg=#{@gray},fg=#{@yellow},bold"
set -g message-command-style "bg=#{@gray},fg=#{@purple},bold"
setw -g mode-style "bg=#{@blue},fg=#{@bg},bold"
set -g display-panes-active-colour "#{@green}"
set -g display-panes-colour "#{@orange}"
set -g @floax-border-color "#{@blue}"
set -g @floax-text-color "#{@fg}"
